<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nedap AEOS Canlı İzleme</title>
  <style>
    :root {
      --nedap-orange: #FF5F00;
      --nedap-dark-blue: #0B2545;
      --nedap-light-blue: #0076C0;
      --bg-light: #F4F7FA;
      --card-bg: #FFFFFF;
      --border-color: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Segoe UI, sans-serif; }
    body { background-color: var(--bg-light); display: flex; height: 100vh; }
    .sidebar { width: 240px; background-color: var(--nedap-dark-blue); color: #fff; padding: 20px; }
    .brand { font-size: 18px; font-weight: bold; margin-bottom: 30px; }
    .brand span { color: var(--nedap-orange); }
    .main { flex: 1; display: flex; flex-direction: column; }
    header { background: #fff; padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; }
    .content { padding: 24px; overflow-y: auto; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge-ok { background: #DCFCE7; color: #166534; }
    .badge-warn { background: #FFEDD5; color: #9A3412; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
    th { background: #F8FAFC; color: #64748B; font-weight: 600; }
    .new-row { animation: highlight 1.5s ease-out; }
    @keyframes highlight { from { background-color: #FFF7ED; } to { background-color: #FFFFFF; } }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="brand">NEDAP <span>MONITOR</span></div>
    <p style="color: #94A3B8; font-size: 13px;">Canlı Geçiş Paneli</p>
  </div>
  <div class="main">
    <header>
      <h3>Canlı Olay ve Kart Bildirimleri</h3>
      <span id="conn-status" class="badge badge-warn">Bağlanıyor...</span>
    </header>
    <div class="content">
      <table>
        <thead>
          <tr>
            <th>Zaman</th>
            <th>Nokta / Kapı</th>
            <th>Kart (CSN / Hex)</th>
            <th>Olay Durumu</th>
          </tr>
        </thead>
        <tbody id="events-table-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = ${protocol}///ws/events;
    const socket = new WebSocket(wsUrl);
    const statusBadge = document.getElementById("conn-status");
    const tableBody = document.getElementById("events-table-body");

    socket.onopen = () => {
      statusBadge.textContent = "● Bağlantı Aktif";
      statusBadge.className = "badge badge-ok";
    };

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);
      const row = document.createElement("tr");
      row.className = "new-row";

      const isAlert = data.status.includes("Yetkisiz") || data.status.includes("Zorlama");
      const statusColor = isAlert ? "var(--nedap-orange)" : "#10B981";

      row.innerHTML = 
        <td></td>
        <td><strong></strong></td>
        <td><code></code></td>
        <td style="color: ; font-weight: 600;"></td>
      ;

      tableBody.insertBefore(row, tableBody.firstChild);
      if (tableBody.children.length > 20) tableBody.removeChild(tableBody.lastChild);
    };

    socket.onclose = () => {
      statusBadge.textContent = "● Bağlantı Kesildi";
      statusBadge.className = "badge badge-warn";
    };
  </script>
</body>
</html>
